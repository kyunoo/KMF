<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>글 작성</title>
</head>
<body>
  <h1>글 작성하기</h1>
  <input id="title" placeholder="제목"><br>
  <textarea id="content" placeholder="내용"></textarea><br>
  <input id="topic" placeholder="주제"><br>
  <button id="submitBtn">작성 완료</button>

  <script>
    document.getElementById("submitBtn").addEventListener("click", () => {
      const title = document.getElementById("title").value;
      const content = document.getElementById("content").value;
      const topic = document.getElementById("topic").value;

      fetch("/api/posts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, content, topic })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert("글이 저장되었습니다!");
          window.location.href = "/community"; // 작성 후 커뮤니티로 돌아가기
        } else {
          alert("에러: " + data.error);
        }
      })
      .catch(err => {
        console.error(err);
        alert("서버 요청 중 오류 발생");
      });
    });
  </script>
</body>
</html>
