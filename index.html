<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Korean Munich Fan Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 제목 -->
  <div class="header">
    Welcome to Korean Munich Fan Page
  </div>

  <!-- 왼쪽 메뉴 -->
  <div class="sidebar">
    <button onclick="goCommunity()">커뮤니티</button>
    <button onclick="goHistory()">뮌헨의 역사</button>
    <button onclick="goNews()">뮌뉴스</button>
  </div>

  <!-- 슬라이드 -->
  <div class="slider-container">
    <div class="slide active">
      <img src="https://img.a.transfermarkt.technology/portrait/big/17259-1694609670.jpg">
      <div class="caption">Manuel Neuer</div>
    </div>
    <div class="slide">
      <img src="https://img.a.transfermarkt.technology/portrait/big/132098-1694609675.jpg">
      <div class="caption">Joshua Kimmich</div>
    </div>
    <div class="slide">
      <img src="https://img.a.transfermarkt.technology/portrait/big/580195-1694609672.jpg">
      <div class="caption">Jamal Musiala</div>
    </div>
    <div class="slide">
      <img src="https://img.a.transfermarkt.technology/portrait/big/5803-1694609676.jpg">
      <div class="caption">Harry Kane</div>
    </div>

    <!-- 좌우 버튼 -->
    <button class="prev" onclick="prevSlide()">❮</button>
    <button class="next" onclick="nextSlide()">❯</button>
  </div>

  <!-- 오른쪽 아래 인스타 버튼 -->
  <div class="bottom-right">
    <button onclick="goFanInstagram()">팬페이지 인스타</button>
    <button onclick="goOfficialInstagram()">공식 인스타</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
