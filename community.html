<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>커뮤니티</title>
  <link rel="stylesheet" href="communitystyle.css">
</head>
<body>

  <!-- 상단 배너 -->
  <div class="banner">
    <img src="kmc.jpg" alt="커뮤니티 배너">
  </div>

  <div class="container">
    <!-- 주제 선택 박스 -->
    <div class="topics">
      <ul>
        <li onclick="filterTopic('공지사항')">공지사항</li>
        <li onclick="filterTopic('전체')">전체</li>
        <li onclick="filterTopic('뮌유머')">뮌유머</li>
        <li onclick="filterTopic('경기 및 전술 분석')">경기 및 전술 분석</li>
        <li onclick="filterTopic('자유 게시판')">자유 게시판</li>
      </ul>
    </div>

    <!-- 글 목록 -->
    <div class="posts">
      <div id="post-list">
        아직 글이 올라오지 않았습니다.
      </div>

      <!-- 페이지네이션 -->
      <div class="pagination"></div>
    </div>
  </div>

  <!-- 버튼 -->
  <div class="buttons">
    <button onclick="goWrite()">글 작성</button>
    <button onclick="goHome()">홈</button>
  </div>

  <script src="community.js"></script>
</body>
</html>
