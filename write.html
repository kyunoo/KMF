<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>글 작성</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
      padding: 50px;
    }
    input, textarea, select {
      width: 300px;
      margin: 10px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 20px;
      background: darkred;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: black;
    }
  </style>
</head>
<body>
  <a href="/" style="position:fixed;top:10px;right:10px;background:yellow;color:black;padding:5px 10px;text-decoration:none;">홈</a>
  <h1>글 작성하기</h1>
  <input id="title" placeholder="제목"><br>
  <textarea id="content" placeholder="내용"></textarea><br>
  <select id="topic">
    <option value="공지사항">공지사항</option>
    <option value="뮌유머">뮌유머</option>
    <option value="경기 및 전술 분석">경기 및 전술 분석</option>
    <option value="자유 게시판">자유 게시판</option>
  </select><br>
  <button id="submitBtn">작성 완료</button>

  <script>
    document.getElementById("submitBtn").addEventListener("click", () => {
      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").value.trim();
      const topic = document.getElementById("topic").value;

      if (!title || !content || !topic) {
        alert("제목, 내용, 주제를 모두 입력하세요!");
        return;
      }

      fetch("/api/posts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, content, topic })
      })
      .then(res => res.json())
      .then(data => {
        if (data.id) {
          alert("글이 저장되었습니다!");
          window.location.href = "/community"; 
        } else {
          alert("에러: " + (data.error || "알 수 없는 오류"));
        }
      })
      .catch(err => {
        console.error(err);
        alert("서버 요청 중 오류 발생");
      });
    });
  </script>
</body>
</html>
