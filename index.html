<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Korean Munich Fan Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 제목 -->
  <div class="header">
    Welcome to Korean Munich Fan Page
  </div>

  <!-- 왼쪽 메뉴 -->
  <div class="sidebar">
    <button onclick="goCommunity()">커뮤니티</button>
    <button onclick="alert('준비중입니다')">뮌헨의 역사</button>
    <button onclick="alert('준비중입니다')">뮌뉴스</button>
    <button onclick="alert('준비중입니다')">매치 센터</button>
    <button onclick="alert('준비중입니다')">스토어</button>
  </div>

  <!-- 배경 슬라이드 -->
  <div class="background-slider">
    <img src="background1.jpg" class="bg active">
    <img src="background2.jpg" class="bg">
    <img src="background3.jpg" class="bg">
  </div>

  <!-- 선수 사진 슬라이드 -->
  <div class="player-slider">
    <div class="player-slide active"><img src="neuer.jpg"></div>
    <div class="player-slide"><img src="ulreich.jpg"></div>
    <div class="player-slide"><img src="urbig.jpg"></div>
    <div class="player-slide"><img src="upamecano.jpg"></div>
    <div class="player-slide"><img src="kim.jpg"></div>
    <div class="player-slide"><img src="tah.jpg"></div>
    <div class="player-slide"><img src="davies.jpg"></div>
    <div class="player-slide"><img src="ito.jpg"></div>
    <div class="player-slide"><img src="guerreiro.jpg"></div>
    <div class="player-slide"><img src="goretzka.jpg"></div>
    <div class="player-slide"><img src="musiala.jpg"></div>
    <div class="player-slide"><img src="bischof.jpg"></div>
    <div class="player-slide"><img src="laimer.jpg"></div>
    <div class="player-slide"><img src="karl.jpg"></div>
    <div class="player-slide"><img src="gnabry.jpg"></div>
    <div class="player-slide"><img src="kane.jpg"></div>
    <div class="player-slide"><img src="jackson.jpg"></div>
    <div class="player-slide"><img src="diaz.jpg"></div>
    <div class="player-slide"><img src="olise.jpg"></div>
    <div class="player-slide"><img src="company.jpg"></div>

    <button class="prev" onclick="prevPlayer()">❮</button>
    <button class="next" onclick="nextPlayer()">❯</button>
  </div>

  <!-- 인스타 버튼 -->
  <div class="bottom-right">
    <a href="https://www.instagram.com/_bayern_times_kr?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank">
      팬페이지 인스타
    </a>
  </div>

  <script src="script.js"></script>
</body>
</html>
