<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>글 보기</title>
  <link rel="stylesheet" href="communitystyle.css">
</head>
<body>

  <div class="banner">
    <img src="kmc.jpg" alt="커뮤니티 배너">
  </div>

  <div class="container">
    <!-- 주제 선택 박스 -->
    <div class="topics">
      <h3>주제 선택</h3>
      <ul>
        <li>공지사항</li>
        <li>전체</li>
        <li>뮌유머</li>
        <li>경기 및 전술 분석</li>
        <li>자유 게시판</li>
      </ul>
    </div>

    <!-- 글 내용 -->
    <div class="post-view">
      <h2 id="post-title">제목</h2>
      <p class="date">2026-02-25</p>
      <div id="post-content">글 내용 표시</div>

      <div class="buttons-fixed">
        <button onclick="goHome()">홈</button>
        <button onclick="goWrite()">글 작성</button>
        <button onclick="editPost()">수정</button>
        <button onclick="deletePost()">삭제</button>
      </div>
    </div>
  </div>

  <script src="community.js"></script>
</body>
</html>
