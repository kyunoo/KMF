<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Korean Munich Fan Page</title>

<style>

/* 전체 배경 */
body{
    margin:0;
    font-family: Arial, sans-serif;
    color:white;
    height:100vh;
    overflow:hidden;

    background:
    linear-gradient(rgba(160,0,0,0.6), rgba(0,0,0,0.9)),
    url("https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/Allianz_Arena_Munich.jpg/1920px-Allianz_Arena_Munich.jpg");

    background-size:cover;
    background-position:center;
}

/* 제목 */
.title{
    text-align:center;
    font-size:42px;
    margin-top:30px;
    font-weight:bold;
}

/* 왼쪽 메뉴 */
.sidebar{
    position:absolute;
    left:50px;
    top:180px;
}

.sidebar a{
    display:block;
    margin:25px 0;
    font-size:22px;
    cursor:pointer;
    color:white;
    text-decoration:none;
    transition:0.3s;
}

.sidebar a:hover{
    color:red;
}

/* 슬라이드 */
.slider{
    position:absolute;
    top:180px;
    left:50%;
    transform:translateX(-50%);
    width:600px;
    height:350px;
    border:4px solid white;
    border-radius:10px;
    overflow:hidden;
    background:black;
}

.slide{
    width:100%;
    height:100%;
    display:none;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.slide.active{
    display:block;
}

/* 버튼 */
.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:30px;
    background:rgba(0,0,0,0.5);
    padding:10px;
    cursor:pointer;
}

.left{
    left:0;
}

.right{
    right:0;
}

/* 오른쪽 아래 링크 */
.bottom-right{
    position:absolute;
    right:20px;
    bottom:20px;
    text-align:right;
}

.bottom-right div{
    margin:10px;
    cursor:pointer;
}

.bottom-right div:hover{
    color:red;
}

</style>
</head>

<body>

<div class="title">
Welcome to Korean Munich Fan Page
</div>


<!-- 왼쪽 메뉴 -->
<div class="sidebar">

<a href="community.html">
커뮤니티
</a>

<a href="#">
뮌헨의 역사
</a>

<a href="#">
뮌뉴스
</a>

</div>


<!-- 슬라이드 -->
<div class="slider">

<div class="slide active">
<img src="https://img.a.transfermarkt.technology/portrait/big/17259-1694609670.jpg">
</div>

<div class="slide">
<img src="https://img.a.transfermarkt.technology/portrait/big/132098-1694609675.jpg">
</div>

<div class="slide">
<img src="https://img.a.transfermarkt.technology/portrait/big/580195-1694609672.jpg">
</div>

<div class="slide">
<img src="https://img.a.transfermarkt.technology/portrait/big/5803-1694609676.jpg">
</div>


<div class="arrow left" onclick="prevSlide()">❮</div>
<div class="arrow right" onclick="nextSlide()">❯</div>

</div>


<!-- 오른쪽 아래 -->
<div class="bottom-right">

<div>
선수단 팬페이지 인스타
</div>

<div>
선수단 인스타
</div>

</div>


<script>

let slides = document.querySelectorAll(".slide");

let index = 0;

let autoSlide;
let restartTimer;


function showSlide(i){

slides.forEach(slide => slide.classList.remove("active"));

slides[i].classList.add("active");

}


function nextSlide(){

index++;

if(index >= slides.length)
index = 0;

showSlide(index);

resetAuto();

}


function prevSlide(){

index--;

if(index < 0)
index = slides.length-1;

showSlide(index);

resetAuto();

}


function startAuto(){

autoSlide = setInterval(()=>{

index++;

if(index >= slides.length)
index = 0;

showSlide(index);

},5000);

}


function resetAuto(){

clearInterval(autoSlide);

clearTimeout(restartTimer);

restartTimer = setTimeout(()=>{

startAuto();

},2000);

}


startAuto();

</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
</script>
</body>
</html>
