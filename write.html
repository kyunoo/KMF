<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>글 작성</title>
  <link rel="stylesheet" href="communitystyle.css">
</head>
<body>

  <div class="banner">
    <img src="kmc.jpg" alt="커뮤니티 배너">
  </div>

  <div class="write-container">
    <h2>글 작성</h2>

    <label>주제 선택:</label>
    <select id="topic">
      <option>공지사항</option>
      <option>뮌유머</option>
      <option>경기 및 전술 분석</option>
      <option>자유 게시판</option>
    </select>

    <label>제목:</label>
    <input type="text" id="title" maxlength="50">

    <label>내용:</label>
    <textarea id="content" maxlength="500"></textarea>

    <label>사진 추가:</label>
    <input type="file" id="image">

    <div class="buttons-fixed">
      <button onclick="goHome()">홈</button>
      <button onclick="submitPost()">글 올리기</button>
      <button onclick="cancelWrite()">취소</button>
    </div>
  </div>

  <script src="community.js"></script>
</body>
</html>
