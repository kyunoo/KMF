<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body{
  background:#111;
  color:white;
  font-family:Arial;
  padding:20px;
}
h2{
  margin-bottom:10px;
}
.content{
  white-space:pre-wrap;
  line-height:1.5;
}
button{
  padding:10px 20px;
  margin-top:20px;
  cursor:pointer;
}
</style>
</head>
<body onload="loadPost()">

<h2 id="postTitle"></h2>
<div id="postContent" class="content"></div>

<button onclick="goBack()">뒤로가기</button>
<button onclick="deletePost()">삭제하기</button>

<script>
let currentIndex = null;

async function loadPost(){
  // URL에서 index 값 가져오기
  let params=new URLSearchParams(location.search);
  currentIndex=params.get("index");

  // 서버에서 글 목록 가져오기
  const res=await fetch("http://localhost:3000/api/posts");
  const posts=await res.json();

  // 해당 index 글 표시
  if(posts[currentIndex]){
    document.getElementById("postTitle").innerText=posts[currentIndex].title;
    document.getElementById("postContent").innerText=posts[currentIndex].content;
  } else {
    document.getElementById("postTitle").innerText="글을 찾을 수 없습니다";
    document.getElementById("postContent").innerText="";
  }
}

function goBack(){
  location.href="community.html";
}

async function deletePost(){
  if(currentIndex===null) return;

  // 서버에 삭제 요청
  await fetch("http://localhost:3000/api/posts/"+currentIndex, {
    method: "DELETE"
  });

  // 삭제 후 커뮤니티 페이지로 이동
  location.href="community.html";
}
</script>

</body>
</html>
