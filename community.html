<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Korean Munich Community</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, darkred, black);
      color: white;
      margin: 0;
      padding: 0;
      display: flex;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: black;
      color: yellow;
      text-align: center;
      padding: 15px;
      font-size: 24px;
      font-weight: bold;
    }
    nav {
      position: fixed;
      top: 60px;
      left: 0;
      width: 200px;
      background: rgba(255,255,255,0.1);
      height: 100%;
      padding-top: 20px;
    }
    nav div {
      padding: 15px;
      cursor: pointer;
    }
    nav div:hover {
      background: rgba(255,255,255,0.3);
    }
    #content {
      margin-left: 220px;
      margin-top: 80px;
      flex: 1;
      padding: 20px;
    }
    #currentTopic {
      background: rgba(255,255,255,0.2);
      padding: 10px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
    }
    .home-btn {
      position: fixed;
      top: 15px;
      right: 20px;
      background: yellow;
      color: black;
      padding: 8px 15px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>Korean Munich Community</header>
  <a href="/" class="home-btn">홈</a>

  <nav>
    <div onclick="loadPosts('공지사항')">공지사항</div>
    <div onclick="loadPosts('뮌유머')">뮌유머</div>
    <div onclick="loadPosts('경기 및 전술 분석')">경기 및 전술 분석</div>
    <div onclick="loadPosts('자유 게시판')">자유 게시판</div>
    <div><a href="/write.html" style="color:white;text-decoration:none;">글 작성</a></div>
  </nav>

  <div id="content">
    <div id="currentTopic">주제를 선택하세요</div>
    <div id="postList"></div>
  </div>

  <script>
    function loadPosts(topic) {
      document.getElementById("currentTopic").innerText = "현재 주제: " + topic;
      fetch("/api/posts?topic=" + encodeURIComponent(topic))
        .then(res => res.json())
        .then(posts => {
          const list = document.getElementById("postList");
          list.innerHTML = "";
          if(posts.length === 0){
            list.innerHTML = "<p>아직 글이 없습니다.</p>";
          } else {
            posts.forEach((p, i) => {
              const div = document.createElement("div");
              div.innerHTML = `<strong>${p.title}</strong><br>${p.content}<hr>`;
              list.appendChild(div);
            });
          }
        });
    }
  </script>
</body>
</html>
