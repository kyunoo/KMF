<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Korean Munich Community</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, darkred, black);
      color: white;
      margin: 0;
      padding: 0;
    }
    header {
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
    }
    nav {
      background: black;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      color: yellow;
    }
    .topics {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 30px;
    }
    .topic-box {
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 20px;
      margin: 10px;
      width: 200px;
      text-align: center;
      cursor: pointer;
    }
    .topic-box:hover {
      background: rgba(255,255,255,0.2);
    }
    .write-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: yellow;
      color: black;
      padding: 15px 20px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>Korean Munich Community</header>
  <nav>
    <a href="/">홈</a>
    <a href="/community">커뮤니티</a>
    <a href="/history.html">민헬의 역사</a>
    <a href="/news.html">민뉴스</a>
  </nav>

  <section class="topics">
    <div class="topic-box">⚽ 스포츠</div>
    <div class="topic-box">🎵 음악</div>
    <div class="topic-box">🍴 음식</div>
    <div class="topic-box">📚 공부</div>
    <div class="topic-box">💼 취업</div>
  </section>

  <!-- 글쓰기 버튼 (오른쪽 아래 고정) -->
  <a href="/write.html" class="write-btn">+</a>
</body>
</html>
