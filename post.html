<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>글 상세</title>
</head>
<body>
  <a href="/" style="position:fixed;top:10px;right:10px;background:yellow;color:black;padding:5px 10px;text-decoration:none;">홈</a>
  <h1 id="title"></h1>
  <p id="content"></p>
  <p><strong>주제:</strong> <span id="topic"></span></p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const index = params.get("index");
    const topic = params.get("topic");

    fetch("/api/posts?topic=" + encodeURIComponent(topic))
      .then(res => res.json())
      .then(posts => {
        const post = posts[index];
        if(post){
          document.getElementById("title").innerText = post.title;
          document.getElementById("content").innerText = post.content;
          document.getElementById("topic").innerText = post.topic;
        } else {
          document.body.innerHTML = "<p>글을 찾을 수 없습니다.</p>";
        }
      });
  </script>
</body>
</html>
